<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="champagne-stone">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>CHARISMA JEWELRY | مجوهرات كاريزما</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. BRAND COLOR PALETTE (EXACT MATCH WITH LOGO #D8D0C5)
       ========================================================================== */
    :root {
      --bg-exact-logo: #D8D0C5;
      --surface-glass: rgba(244, 239, 231, 0.88);
      --surface-floating-nav: rgba(48, 34, 19, 0.94);
      --surface-card: #E6DFD5;
      --surface-card-hover: #F1ECE4;
      --surface-elevated: #F5F1EA;
      --border-gold-soft: rgba(173, 141, 103, 0.28);
      --border-gold-strong: rgba(167, 134, 99, 0.62);

      --gold-highlight: #F3DFB9;
      --gold-champagne: #CDB181;
      --gold-primary: #AD8D67;
      --gold-bronze: #8E6E4A;
      --gold-deep-shadow: #584024;

      --text-primary: #352514;
      --text-secondary: #655039;
      --text-muted: #87725A;

      --gradient-logo-bg: linear-gradient(180deg, #DFD7CC 0%, #D8D0C5 50%, #CFC6BA 100%);
      --gradient-gold-btn: linear-gradient(135deg, #8B6B47 0%, #AD8D67 45%, #CDB181 75%, #9B7A54 100%);
      --gradient-gold-text: linear-gradient(180deg, #8C6C46 0%, #B7966E 45%, #5E4427 100%);
      --shadow-emboss: 0 14px 32px -10px rgba(72, 52, 30, 0.14), 0 4px 10px rgba(72, 52, 30, 0.06);
      --shadow-inset-stone: inset 0 2px 5px rgba(255, 255, 255, 0.65), inset 0 -2px 6px rgba(122, 96, 68, 0.12);
    }

    [data-theme="royal-velvet"] {
      --surface-glass: rgba(28, 21, 15, 0.9);
      --surface-floating-nav: rgba(22, 16, 11, 0.95);
      --surface-card: #1E1712;
      --surface-card-hover: #271E17;
      --surface-elevated: #281F18;
      --border-gold-soft: rgba(205, 177, 129, 0.22);
      --border-gold-strong: rgba(205, 177, 129, 0.62);
      --text-primary: #F5EDE2;
      --text-secondary: #D0BEA4;
      --text-muted: #9A866D;
      --gradient-logo-bg: radial-gradient(circle at 50% 30%, #261D15 0%, #16110C 65%, #0C0906 100%);
      --gradient-gold-text: linear-gradient(180deg, #F5E2BE 0%, #CDB181 50%, #9E7E56 100%);
      --shadow-emboss: 0 18px 44px rgba(0, 0, 0, 0.65), 0 4px 14px rgba(205, 177, 129, 0.1);
      --shadow-inset-stone: inset 0 1px 2px rgba(255, 235, 200, 0.1), inset 0 -2px 6px rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--gradient-logo-bg);
      background-attachment: fixed;
      color: var(--text-primary);
      overflow-x: hidden;
      width: 100%;
      min-height: 100dvh;
      position: relative;
      transition: background 0.5s ease, color 0.4s ease;
    }

    body.splash-lock {
      overflow: hidden;
    }

    svg.icon-svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ==========================================================================
       2. SEAMLESS SPLASH SCREEN (#D8D0C5)
       ========================================================================== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background-color: #D8D0C5;
      transition: opacity 1.05s cubic-bezier(0.77, 0, 0.175, 1),
                  transform 1.15s cubic-bezier(0.77, 0, 0.175, 1),
                  visibility 1.05s;
      overflow: hidden;
      user-select: none;
    }

    #splash-screen.splash-hidden {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-box {
      position: relative;
      width: min(84vw, 420px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splashFadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes splashFadeUp {
      0% { opacity: 0; transform: scale(0.93) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .splash-logo-mask {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .splash-logo-mask img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .splash-diamond-glint {
      position: absolute;
      left: 53.47%;
      top: 40.92%;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-diamond-glint svg {
      width: 100%;
      height: 100%;
      animation: crispStarGlint 2.6s ease-in-out infinite;
    }

    @keyframes crispStarGlint {
      0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.5; }
      50% { transform: scale(1.18) rotate(45deg); opacity: 1; }
    }

    .splash-loader-wrap {
      margin-top: -0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      z-index: 10;
    }

    .splash-tagline {
      font-family: 'Amiri', serif;
      font-size: clamp(1.35rem, 4.5vw, 1.65rem);
      font-weight: 700;
      color: #4E3820;
      letter-spacing: 0.03em;
    }

    .splash-progress-track {
      width: min(60vw, 200px);
      height: 2.5px;
      background: rgba(142, 110, 74, 0.22);
      border-radius: 99px;
      overflow: hidden;
    }

    .splash-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8E6E4A, #FFFFFF, #AD8D67);
      border-radius: 99px;
      transition: width 5.2s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    /* ==========================================================================
       3. TOP LIVE GOLD MARKET TICKER BAR (ريال سعودي فقط)
       ========================================================================== */
    .live-gold-bar {
      position: relative;
      z-index: 50;
      background: linear-gradient(90deg, #3A2816 0%, #563D23 50%, #3A2816 100%);
      color: #F4ECE0;
      padding: 0.45rem 0.9rem;
      font-size: 0.8rem;
      border-bottom: 1px solid #AD8D67;
    }

    .live-gold-bar-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .ticker-items-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #D4AF37;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #F3DFB9;
      flex-shrink: 0;
    }

    .ticker-karat-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.14rem 0.55rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(205, 177, 129, 0.25);
      white-space: nowrap;
    }

    .ticker-karat-pill .price-val {
      color: #F3DFB9;
      font-weight: 700;
    }

    /* ==========================================================================
       4. FLOATING CAPSULE HEADER
       ========================================================================== */
    .header-outer-wrap {
      position: sticky;
      top: 10px;
      z-index: 100;
      padding: 0 0.85rem;
      margin-top: 0.65rem;
      margin-bottom: 1.25rem;
      pointer-events: none;
    }

    .main-header {
      pointer-events: auto;
      max-width: 1280px;
      margin: 0 auto;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid var(--border-gold-strong);
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(56, 39, 20, 0.12),
                  inset 0 1px 2px rgba(255, 255, 255, 0.75);
      transition: all 0.3s ease;
    }

    .navbar-container {
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .brand-identity {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text-primary);
      min-width: 0;
    }

    .brand-emblem-svg {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 5px rgba(92, 67, 38, 0.22));
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 3.2vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1.05;
      background: var(--gradient-gold-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .brand-subtitle-ar {
      font-size: 0.74rem;
      color: var(--text-secondary);
      font-weight: 700;
      margin-top: 1px;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      list-style: none;
      background: var(--surface-elevated);
      padding: 0.28rem;
      border-radius: 999px;
      border: 1px solid var(--border-gold-soft);
      box-shadow: var(--shadow-inset-stone);
    }

    .nav-links button {
      background: transparent;
      border: none;
      font-family: 'Tajawal', sans-serif;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 0.84rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-links button:hover,
    .nav-links button.active {
      background: var(--gradient-gold-btn);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(142, 110, 74, 0.28);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .icon-action-btn {
      position: relative;
      background: var(--surface-elevated);
      border: 1px solid var(--border-gold-soft);
      color: var(--text-primary);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      box-shadow: var(--shadow-inset-stone);
      transition: all 0.25s ease;
    }

    .icon-action-btn:hover {
      border-color: var(--gold-primary);
      background: var(--gradient-gold-btn);
      color: #FFF;
    }

    .badge-count {
      background: #4B3621;
      color: #F5E2BE;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.04rem 0.4rem;
      border-radius: 999px;
      border: 1px solid #CDB181;
    }

    /* ==========================================================================
       5. GOLD FAMILIES CATALOG (عائلات منتجات الذهب الصافي)
       ========================================================================== */
    .catalog-section {
      position: relative;
      z-index: 10;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.25rem 1.15rem 6.5rem;
    }

    /* Family Tabs & Search Bar */
    .catalog-controls-bar {
      background: var(--surface-card);
      border: 1px solid var(--border-gold-soft);
      border-radius: 18px;
      padding: 0.9rem 1rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-inset-stone);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .category-tabs {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      justify-content: center;
    }
    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .cat-tab-btn {
      background: var(--surface-elevated);
      border: 1px solid var(--border-gold-soft);
      color: var(--text-primary);
      padding: 0.5rem 1.05rem;
      border-radius: 999px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
      transition: all 0.25s;
    }

    .cat-tab-btn:hover,
    .cat-tab-btn.active {
      background: var(--gradient-gold-btn);
      color: #FFF;
      border-color: #7A5C38;
      box-shadow: 0 4px 12px rgba(142, 110, 74, 0.26);
    }

    .secondary-filters-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--border-gold-soft);
    }

    .search-input-wrap {
      position: relative;
      flex: 1 1 220px;
      min-width: 0;
    }

    .search-input-wrap input {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border-gold-soft);
      color: var(--text-primary);
      padding: 0.58rem 2.3rem 0.58rem 0.9rem;
      border-radius: 999px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.86rem;
      outline: none;
    }

    .search-input-wrap .search-icon {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-bronze);
      pointer-events: none;
      display: flex;
    }

    .filter-selects-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      flex: 1 1 auto;
      justify-content: flex-end;
    }

    .luxury-select {
      background: var(--surface-elevated);
      border: 1px solid var(--border-gold-soft);
      color: var(--text-primary);
      padding: 0.54rem 0.8rem;
      border-radius: 999px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 100%;
    }

    /* Family Section Block */
    .family-section-block {
      margin-bottom: 2.75rem;
    }

    .family-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.15rem;
      padding-bottom: 0.65rem;
      border-bottom: 1.5px solid var(--border-gold-soft);
    }

    .family-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .family-title {
      font-family: 'Amiri', serif;
      font-size: clamp(1.38rem, 3.5vw, 1.85rem);
      color: var(--text-primary);
      font-weight: 700;
    }

    .family-count-pill {
      background: var(--surface-elevated);
      border: 1px solid var(--border-gold-strong);
      color: var(--gold-bronze);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      position: relative;
      background: var(--surface-card);
      border: 1px solid var(--border-gold-soft);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-emboss);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-gold-strong);
      box-shadow: 0 18px 38px -12px rgba(72, 52, 30, 0.22);
    }

    .product-media {
      position: relative;
      height: 225px;
      background: #D8D0C5;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .product-card:hover .product-media img {
      transform: scale(1.05);
    }

    .product-top-badges {
      position: absolute;
      top: 10px;
      inset-inline: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 4;
      pointer-events: none;
    }

    .karat-badge {
      background: rgba(56, 39, 20, 0.9);
      color: #F3DFB9;
      border: 1px solid #CDB181;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      backdrop-filter: blur(6px);
      display: inline-flex;
      align-items: center;
    }

    .wishlist-btn {
      pointer-events: auto;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(173, 141, 103, 0.4);
      color: #5C4326;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s;
    }
    .wishlist-btn:hover,
    .wishlist-btn.wish-active {
      background: #8E6E4A;
      color: #FFF;
      border-color: #8E6E4A;
    }

    .product-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.55rem;
    }

    .product-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .product-title {
      font-family: 'Amiri', serif;
      font-size: 1.2rem;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .product-specs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .spec-chip {
      background: var(--surface-elevated);
      border: 1px solid var(--border-gold-soft);
      padding: 0.2rem 0.55rem;
      border-radius: 7px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .card-karat-switcher {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-elevated);
      padding: 0.34rem 0.55rem;
      border-radius: 9px;
      border: 1px solid var(--border-gold-soft);
      font-size: 0.74rem;
    }

    .karat-dots {
      display: flex;
      gap: 0.28rem;
    }

    .karat-choice-btn {
      border: 1px solid rgba(142, 110, 74, 0.4);
      background: transparent;
      color: var(--text-primary);
      font-family: 'Tajawal', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.14rem 0.45rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .karat-choice-btn.active {
      background: var(--gold-primary);
      color: #FFF;
      border-color: var(--gold-deep-shadow);
    }

    .product-price-row {
      margin-top: auto;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--border-gold-soft);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .price-block .price-label {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .price-block .price-amount {
      font-size: 1.24rem;
      font-weight: 800;
      color: var(--gold-bronze);
    }

    .card-actions {
      display: flex;
      gap: 0.35rem;
    }

    .btn-quick-view {
      background: var(--surface-elevated);
      border: 1px solid var(--border-gold-strong);
      color: var(--text-primary);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-quick-view:hover {
      background: var(--gold-champagne);
      color: #2B1D0E;
    }

    .btn-add-cart {
      background: linear-gradient(135deg, #5C4326 0%, #AD8D67 100%);
      color: #FFF;
      border: 1px solid #CDB181;
      padding: 0 0.9rem;
      height: 38px;
      border-radius: 10px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }
    .btn-add-cart:hover {
      background: linear-gradient(135deg, #3D2B19 0%, #8E6E4A 100%);
    }

    .btn-primary-gold {

    /* Pure Gold Price Calculation (No Diamonds) */
    function calculateProductPriceSAR(product, karatOverride) {
      const karat = karatOverride || product.selectedKarat;
      const ratePerGram = MARKET_RATES_SAR[karat] || MARKET_RATES_SAR[21];
      const pureGoldCost = product.weightGrams * ratePerGram;
      const makingCost = product.weightGrams * product.makingFeePerGram;
      const totalSAR = Math.round(pureGoldCost + makingCost);
      return {
        karat,
        ratePerGram,
        pureGoldCost,
        makingCost,
        totalSAR
      };
    }

      activeFamily = famId;

      document.querySelectorAll('.cat-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.fam === famId);

      document.querySelectorAll('#header-family-links button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.fam === famId);
      });
      document.querySelectorAll('.dock-nav-item[data-dock-fam]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.dockFam === famId);
      });

      renderFamiliesCatalog();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchCardKarat(productId, newKarat) {
      const prod = PRODUCTS_DB.find(p => p.id === productId);
      if (!prod) return;
      prod.selectedKarat = newKarat;
      renderFamiliesCatalog();
    }

      if (wishlistIds.has(productId)) {
        wishlistIds.delete(productId);
        showToast('تمت إزالة القطعة من المفضلة');
      } else {
        wishlistIds.add(productId);
        showToast('تمت إضافة القطعة إلى المفضلة');
      }
      renderFamiliesCatalog();
    }

    function renderFamiliesCatalog() {
      const container = document.getElementById('families-catalog-container');
      const searchVal = (document.getElementById('product-search-input')?.value || '').trim().toLowerCase();
      const karatFilter = document.getElementById('karat-filter-select')?.value || 'all';
      const sortMode = document.getElementById('sort-select')?.value || 'featured';

      const familiesToShow = activeFamily === 'all'
        ? GOLD_FAMILIES
        : GOLD_FAMILIES.filter(f => f.id === activeFamily);

      let htmlBlocks = '';

      familiesToShow.forEach(fam => {
        let famProducts = PRODUCTS_DB.filter(p => {
          const matchFam = p.family === fam.id;
          const matchKarat = karatFilter === 'all' || String(p.selectedKarat) === karatFilter;
          const matchSearch = !searchVal ||
            p.title.toLowerCase().includes(searchVal) ||
            p.sku.toLowerCase().includes(searchVal) ||
            p.familyLabel.toLowerCase().includes(searchVal);
          return matchFam && matchKarat && matchSearch;
        });

        if (sortMode === 'price-asc') {
          famProducts.sort((a, b) => calculateProductPriceSAR(a).totalSAR - calculateProductPriceSAR(b).totalSAR);
        } else if (sortMode === 'price-desc') {
          famProducts.sort((a, b) => calculateProductPriceSAR(b).totalSAR - calculateProductPriceSAR(a).totalSAR);
        } else if (sortMode === 'weight-desc') {
          famProducts.sort((a, b) => b.weightGrams - a.weightGrams);
        }

        if (famProducts.length > 0) {
          htmlBlocks += `

              <div class="products-grid">
                ${famProducts.map(p => renderProductCardHTML(p)).join('')}
              </div>
            </div>
          `;
        }
      });

      if (!htmlBlocks) {
        container.innerHTML = `
          <div style="text-align:center; padding:2.5rem; background:var(--surface-card); border-radius:20px; border:1px solid var(--border-gold-soft);">
            <p style="font-size:1.1rem; font-weight:700;">لا توجد قطع مطابقة لبحثك حالياً</p>
          </div>
        `;
        return;
      }

      container.innerHTML = htmlBlocks;
    }

    function openQuickViewModal(productId) {
      const product = PRODUCTS_DB.find(p => p.id === productId);
      if (!product) return;
      const calc = calculateProductPriceSAR(product);
      const modal = document.getElementById('quick-view-modal');
      const content = document.getElementById('quick-view-content');

      content.innerHTML = `
        <button type="button" class="modal-close-btn" onclick="closeQuickViewModal()" aria-label="إغلاق">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.25rem; align-items:center;">
          <div style="border-radius:16px; overflow:hidden; border:1px solid var(--border-gold-strong); background:#D8D0C5;">
            <img src="${product.image}" alt="${product.title}" style="width:100%; height:240px; object-fit:cover; display:block;" onerror="this.src='logo_seamless.png'" />
          </div>

          <div style="display:flex; flex-direction:column; gap:0.65rem;">
            <span class="family-count-pill" style="align-self:flex-start;">${product.familyLabel} • ${product.sku}</span>
            <h3 style="font-family:'Amiri',serif; font-size:1.45rem; color:var(--text-primary);">${product.title}</h3>

            <div class="calc-result-card" style="margin-top:0.2rem;">
              <div class="calc-row">
                <span>العيار:</span>
                <strong>ذهب صافي عيار ${calc.karat}K</strong>
              </div>
              <div class="calc-row">
                <span>وزن الذهب:</span>
                <strong>${product.weightGrams} جم</strong>
              </div>
              <div class="calc-row">
                <span>قيمة الذهب الصافي:</span>
                <strong>${formatMoney(calc.pureGoldCost)}</strong>
              </div>
              <div class="calc-row">
                <span>المصنعية:</span>
                <strong>${formatMoney(calc.makingCost)}</strong>
              </div>
              <div class="calc-row total-row">
                <span>السعر الإجمالي:</span>
                <span style="color:var(--gold-bronze);">${formatMoney(calc.totalSAR)}</span>
              </div>
            </div>

            <button type="button" class="btn-primary-gold" style="width:100%; margin-top:0.3rem;" onclick="addToCart(${product.id}, ${calc.karat}); closeQuickViewModal();">
              <span>إضافة إلى الحقيبة</span>
            </button>
          </div>
        </div>
      `;
      modal.classList.add('open');
    }

    function closeQuickViewModal() {
      document.getElementById('quick-view-modal').classList.remove('open');
    }

    function addToCart(productId, karat) {
      cartItems.push({ productId, karat });
      renderCart();
      showToast('تمت إضافة القطعة إلى الحقيبة');
    }

    function removeFromCart(index) {
      cartItems.splice(index, 1);
      renderCart();
    }

    function toggleCartDrawer(open) {
      document.getElementById('cart-drawer').classList.toggle('open', open);
      document.getElementById('cart-backdrop').classList.toggle('open', open);
    }

    function renderCart() {
      const listEl = document.getElementById('cart-items-container');
      const badgeEl = document.getElementById('cart-count-badge');
      const dockBadgeEl = document.getElementById('dock-cart-count');
      badgeEl.textContent = cartItems.length;
      if (dockBadgeEl) dockBadgeEl.textContent = cartItems.length;

      if (cartItems.length === 0) {
        listEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:2rem;">الحقيبة فارغة حالياً</p>`;
        document.getElementById('cart-total-weight').textContent = '0.00 جم';
        document.getElementById('cart-total-price').textContent = formatMoney(0);
        return;
      }

      let totalWeight = 0;
      let totalPriceSAR = 0;

      listEl.innerHTML = cartItems.map((item, idx) => {
        const prod = PRODUCTS_DB.find(p => p.id === item.productId) || PRODUCTS_DB[0];
        const calc = calculateProductPriceSAR(prod, item.karat);
        totalWeight += prod.weightGrams;
        totalPriceSAR += calc.totalSAR;

        return `
          <div class="cart-item-row">
            <img src="${prod.image}" alt="${prod.title}" onerror="this.src='logo_seamless.png'" />
            <div style="flex:1; min-width:0;">
              <strong style="font-size:0.88rem; display:block;">${prod.title}</strong>
              <span style="font-size:0.75rem; color:var(--text-secondary);">ذهب عيار ${item.karat}K • الوزن: ${prod.weightGrams} جم</span>
              <strong style="color:var(--gold-bronze); font-size:0.9rem; display:block; margin-top:2px;">${formatMoney(calc.totalSAR)}</strong>
            </div>
            <button type="button" onclick="removeFromCart(${idx})" style="background:none; border:none; color:#9B2C2C; cursor:pointer; padding:4px;" aria-label="حذف">
              <svg class="icon-svg" viewBox="0 0 24 24" style="width:16px; height:16px;">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total-weight').textContent = `${totalWeight.toFixed(2)} جم`;
      document.getElementById('cart-total-price').textContent = formatMoney(totalPriceSAR);
    }

    function completeCustomerOrder() {
      if (cartItems.length === 0) {
        showToast('الحقيبة فارغة، اختاري قطعة أولاً');
        return;
      }
      toggleCartDrawer(false);
      showToast('تم استلام طلبك بنجاح');
    }

    function updateAllDisplays() {
      document.querySelectorAll('.live-24k-display').forEach(el => {
        el.textContent = formatRatePerGram(MARKET_RATES_SAR[24]);
      });
      document.querySelectorAll('.live-21k-display').forEach(el => {
        el.textContent = formatRatePerGram(MARKET_RATES_SAR[21]);
      });
      document.querySelectorAll('.live-18k-display').forEach(el => {
        el.textContent = formatRatePerGram(MARKET_RATES_SAR[18]);
      });

      renderFamiliesCatalog();
      renderCart();
    }

    function toggleRoyalTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'royal-velvet' ? 'champagne-stone' : 'royal-velvet';
      html.setAttribute('data-theme', next);
      const labelEl = document.getElementById('theme-btn-label');
      if (labelEl) {
        labelEl.textContent = next === 'royal-velvet' ? 'النمط النهاري' : 'النمط المخملي';
      }
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'luxury-toast';
      toast.innerHTML = `<span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
  </script>
</body>
</html>
